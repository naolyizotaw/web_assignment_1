<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puppy Lovers Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="site-header">
        Puppy lovers page
    </div>

    <img class="banner" src="banner-puppies.jpg" alt="Puppies in a basket">

    <br><br>

    <table class="gallery-table">
        <tr>
            <td class="cell-small">
                <img class="puppy-img puppy-img--small" src="puppy-1.jpg" alt="White puppy">
            </td>
            <td class="missing-cell">
                Puppy missing here!!
            </td>
            <td class="cell-small">
                <img class="puppy-img puppy-img--small" src="puppy-2.jpg" alt="Black and white puppy">
            </td>
        </tr>
    </table>

    <br>
    <h2 class="section-title">More Puppies</h2>
    <br>

    <table class="gallery-table">
        <tr>
            <td class="cell-large">
                <img class="puppy-img puppy-img--large" src="puppy-3.jpg" alt="Brown puppy">
            </td>
            <td class="cell-large">
                <img class="puppy-img puppy-img--large" src="puppy-4.jpg" alt="White puppy lying down">
            </td>
        </tr>
    </table>

    <br><br>

    <div class="site-footer">
        Developed by: Naol Yizotaw
    </div>

</body>
</html>
